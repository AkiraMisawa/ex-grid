<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExGrid — Excel-like grids for Blazor</title>
    <meta name="description" content="Documentation and live examples for ExGrid, ExSheet and ExPivot: Excel-like grids for Blazor." />
    <!-- GitHub Pages serves the site under /ex-grid/; the publish workflow rewrites this. -->
    <base href="/" />
    <link rel="icon" href="data:," />
    <link rel="preload" id="webassembly" />
    <!-- Roboto, served by the site itself (the files the demo pages pin), not by a third party. -->
    <link rel="stylesheet" href="fonts/roboto/roboto.css" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/docs.css" />
    <!-- The family's six stylesheets are root components (Program.cs), each at the address of the file
         its package was built with (ADR-0123), as the Installation page tells a Consumer to place them. -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="docs-loading">Loading…</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
