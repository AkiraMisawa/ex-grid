name: Hunt

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Heading repetitions per browser
        type: number
        default: 100

permissions:
  contents: read
  actions: read

concurrency:
  group: hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heading:
    name: Row Heading diagnosis, Server on ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        project: [chrome, msedge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/ExGrid.Browser/package-lock.json
      - name: Install native diagnostic tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
          gdb --version
          google-chrome --version
          microsoft-edge --version
      - name: Install the suite
        working-directory: tests/ExGrid.Browser
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: hunt-hosts
          path: hosts
          run-id: 39587602626
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repeat the unchanged heading gestures
        working-directory: tests/ExGrid.Browser
        env:
          EXGRID_HOSTS: ${{ github.workspace }}/hosts
          EXGRID_HOSTING: server
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 2560x1600x24"
          ./counted-run.sh ${{ inputs.repeat }} headings.spec.mjs --project=${{ matrix.project }}
      - name: Keep diagnostic records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heading-native-${{ matrix.project }}
          path: |
            verification/
            tests/ExGrid.Browser/test-results/
          if-no-files-found: ignore
          retention-days: 30
