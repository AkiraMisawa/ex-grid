name: Hunt

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heading:
    name: Heading diagnosis, Server Chrome, ${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: sequence
            repeat: 100
            grep: '.*'
          - scope: edges
            repeat: 1000
            grep: 'DC-43: a (Column|Row) Heading drag' 
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/ExGrid.Browser/package-lock.json
      - name: Install native diagnostic tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
          gdb --version
          curl --fail --location --output /tmp/exgrid-chrome155.deb https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_155.0.8059.84-1_amd64.deb
          sudo apt-get install -y --allow-downgrades /tmp/exgrid-chrome155.deb
          test "$(dpkg-query --show --showformat='${Version}' google-chrome-stable)" = '155.0.8059.84-1'
          google-chrome --version
          microsoft-edge --version
      - name: Install the suite
        working-directory: tests/ExGrid.Browser
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: hunt-hosts
          path: hosts
          run-id: 39587602626
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repeat the unchanged heading gestures
        working-directory: tests/ExGrid.Browser
        env:
          EXGRID_HOSTS: ${{ github.workspace }}/hosts
          EXGRID_HOSTING: server
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 2560x1600x24"
          ./counted-run.sh ${{ matrix.repeat }} headings.spec.mjs --project=chrome
          --grep '${{ matrix.grep }}' --max-failures=1 --timeout=60000
      - name: Keep diagnostic records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heading-native-${{ matrix.scope }}
          path: |
            verification/
            tests/ExGrid.Browser/test-results/
          if-no-files-found: ignore
          retention-days: 30
