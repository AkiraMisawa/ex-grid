# The Docs Site (ADR-0110), published to GitHub Pages, two ways:
#
# - by the release (release.yml's last job), once the packages are on nuget.org: it passes the
#   version, its tag and the UTC day of the push (ADR-0190), and the site states that version;
# - on demand (workflow_dispatch), from main or a lab/* branch and from no other ref: the site then
#   states the branch and the commit, and says above every page that it describes changes that are
#   not on nuget.org. A lab/* site says that it is an experiment.
#
# A tag no longer starts it: run beside the release, the site stated a version before nuget.org had
# it, and would have stated it had the release failed. CI builds the site with the solution on
# every push; this workflow only publishes.
name: Docs

on:
  workflow_call:
    inputs:
      version:
        description: 'The version the release pushed to nuget.org, as 0.1.0-beta.3'
        type: string
        required: true
      ref:
        description: 'The tag it was published from, as v0.1.0-beta.3'
        type: string
        required: true
      published-on:
        description: 'The UTC day the release pushed the packages to nuget.org, as 2026-10-12'
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer one waits rather than cancelling one already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Publish the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # What the site states, refused before anything is built when it would not be true of the
      # commit checked out below: a version's tag, or main or a lab/* branch and its commit.
      - name: What the site states
        id: states
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.ref }}
          PUBLISHED_ON: ${{ inputs.published-on }}
        run: |
          set -euo pipefail
          if [[ -n "$TAG" ]]; then
            # Called by the release, on the tag it published.
            if [[ "$TAG" != "v$VERSION" ]]; then
              echo "::error::The tag $TAG does not name the version $VERSION (ADR-0042)."
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/tags/$TAG" ]]; then
              echo "::error::Called on $GITHUB_REF, not on the tag $TAG: a version's site is built from the commit its release published."
              exit 1
            fi
            if [[ -n "$PUBLISHED_ON" && ! "$PUBLISHED_ON" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::published-on '$PUBLISHED_ON' is not a day, as 2026-10-12 (ADR-0190)."
              exit 1
            fi
            {
              echo "version=$VERSION"
              echo "ref=$TAG"
              echo "published-on=$PUBLISHED_ON"
            } >> "$GITHUB_OUTPUT"
          else
            # On demand: main or a lab/* branch, and its commit.
            branch="${GITHUB_REF#refs/heads/}"
            if [[ "$GITHUB_REF" != refs/heads/* || ( "$branch" != main && "$branch" != lab/* ) ]]; then
              echo "::error::The Docs Site is published on demand only from main or a lab/* branch (ADR-0110), and $GITHUB_REF is neither. A version's site is published by its release, once nuget.org has the packages."
              exit 1
            fi
            if [[ ! "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::The branch '$branch' has a character the site cannot state; name it with letters, digits, '.', '_', '-' and '/'."
              exit 1
            fi
            {
              echo "version=dev"
              echo "ref=$branch@$GITHUB_SHA"
              echo "published-on="
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The build reads the three together and refuses inputs that disagree (ADR-0110).
      - name: Publish
        env:
          DOCS_VERSION: ${{ steps.states.outputs.version }}
          DOCS_REF: ${{ steps.states.outputs.ref }}
          DOCS_PUBLISHED_ON: ${{ steps.states.outputs.published-on }}
        run: |
          set -euo pipefail
          dotnet publish samples/ExGrid.Docs/ExGrid.Docs.csproj -c Release -o publish \
            "-p:DocsVersion=$DOCS_VERSION" "-p:DocsRef=$DOCS_REF" \
            ${DOCS_PUBLISHED_ON:+"-p:DocsPublishedOn=$DOCS_PUBLISHED_ON"}

      # GitHub Pages serves a project site under /<repository>/. A deep link has no file of its
      # own, so 404.html is the app too; .nojekyll lets _framework/ through. The precompressed
      # copies of index.html would be stale after the rewrite, and Pages does not serve them.
      - name: Prepare for GitHub Pages
        run: |
          site=publish/wwwroot
          sed -i 's#<base href="/" />#<base href="/${{ github.event.repository.name }}/" />#' "$site/index.html"
          grep -q '<base href="/${{ github.event.repository.name }}/" />' "$site/index.html"
          rm -f "$site/index.html.br" "$site/index.html.gz"
          cp "$site/index.html" "$site/404.html"
          touch "$site/.nojekyll"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  # The github-pages environment checks the run's ref against its deployment rules: on the
  # release's call, the caller's ref, which is the tag; on demand, the branch.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
