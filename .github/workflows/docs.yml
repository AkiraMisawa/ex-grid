# The Docs Site (ADR-0110), published to GitHub Pages, two ways:
#
# - by the release (release.yml's last job), once the packages are on nuget.org: it passes the
#   version, its tag and the UTC day of the push (ADR-0190), and the site states that version. The
#   site describes the newest version tagged (ADR-0205, rewritten 2026-11-03, decided with the user):
#   a version, a prerelease included, publishes it when no tag is above it by SemVer precedence, so
#   0.2.0-beta.3 publishes it over 0.1.0's and a patch to an older line does not. A release
#   candidate's section opens with the candidate's note, docs/releases/candidate-note.md, and its
#   Signed off block says the sign-off is being made against it: the build that publishes it reads both;
# - on demand (workflow_dispatch) from main, given a v* tag whose release has put every package on
#   nuget.org and npm: the site is built from the tag and states that version and the day nuget.org
#   received it, as the release would have (2026-11-03, for a tag whose release ran under the rule
#   this replaced), and the same rule refuses a tag some later one is above. It runs from main, not
#   from the tag, because a dispatch runs the workflow its ref holds, and an older tag's has no such path;
# - on demand from main or a lab/* branch, and from no other ref: the site then states the branch and
#   the commit, and says above every page that it describes changes that are not on nuget.org. A
#   lab/* site says that it is an experiment.
#
# A tag no longer starts it: run beside the release, the site stated a version before nuget.org had
# it, and would have stated it had the release failed. CI builds the site with the solution on
# every push; this workflow only publishes.
name: Docs

on:
  workflow_call:
    inputs:
      version:
        description: 'The version the release pushed to nuget.org, as 0.1.0-beta.3'
        type: string
        required: true
      ref:
        description: 'The tag it was published from, as v0.1.0-beta.3'
        type: string
        required: true
      published-on:
        description: 'The UTC day the release pushed the packages to nuget.org, as 2026-10-12'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'A released tag whose site to publish, as v0.2.0-beta.3; empty publishes the branch run on'
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer one waits rather than cancelling one already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Publish the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # What the site states, refused before anything is built when it would not be true of the
      # commit checked out below: a version's tag, or main or a lab/* branch and its commit.
      - name: What the site states
        id: states
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.ref }}
          PUBLISHED_ON: ${{ inputs.published-on }}
          RELEASED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$TAG" ]]; then
            # Called by the release, on the tag it published.
            if [[ "$TAG" != "v$VERSION" ]]; then
              echo "::error::The tag $TAG does not name the version $VERSION (ADR-0042)."
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/tags/$TAG" ]]; then
              echo "::error::Called on $GITHUB_REF, not on the tag $TAG: a version's site is built from the commit its release published."
              exit 1
            fi
            if [[ -n "$PUBLISHED_ON" && ! "$PUBLISHED_ON" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::published-on '$PUBLISHED_ON' is not a day, as 2026-10-12 (ADR-0190)."
              exit 1
            fi
            {
              echo "version=$VERSION"
              echo "ref=$TAG"
              echo "tag=$TAG"
              echo "published-on=$PUBLISHED_ON"
            } >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASED_TAG" ]]; then
            # On demand, a released tag: run from main, whose workflow and release tool know the rule.
            # Its version and day are stated once the registries have it (the steps below check both).
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::A released tag's site is published on demand from main (ADR-0110), and this run is on $GITHUB_REF."
              exit 1
            fi
            if [[ ! "$RELEASED_TAG" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
              echo "::error::'$RELEASED_TAG' is not a v* tag, as v0.2.0-beta.3."
              exit 1
            fi
            {
              echo "version=${RELEASED_TAG#v}"
              echo "ref=$RELEASED_TAG"
              echo "tag=$RELEASED_TAG"
              echo "on-demand=true"
              echo "published-on="
            } >> "$GITHUB_OUTPUT"
          else
            # On demand: main or a lab/* branch, and its commit.
            branch="${GITHUB_REF#refs/heads/}"
            if [[ "$GITHUB_REF" != refs/heads/* || ( "$branch" != main && "$branch" != lab/* ) ]]; then
              echo "::error::The Docs Site is published on demand only from main or a lab/* branch (ADR-0110), and $GITHUB_REF is neither. A version's site is published by its release, once nuget.org has the packages, or from main given its tag."
              exit 1
            fi
            if [[ ! "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::The branch '$branch' has a character the site cannot state; name it with letters, digits, '.', '_', '-' and '/'."
              exit 1
            fi
            {
              echo "version=dev"
              echo "ref=$branch@$GITHUB_SHA"
              echo "tag="
              echo "published-on="
            } >> "$GITHUB_OUTPUT"
          fi

      # A tag's site needs every tag, to know whether a later one is above it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ steps.states.outputs.tag != '' && '0' || '1' }}

      - uses: ./.github/actions/dotnet

      # The site describes the newest version tagged (ADR-0205): a tag's site is published only when no
      # tag is above it by SemVer precedence, a prerelease's included. The release decides that before it
      # calls this workflow (dotnet/tools/release/ExGrid.Release, admit), and this asks the same tool, as
      # the commit checked out has it, so a call that comes anyway, or a released tag given on demand, is
      # refused here rather than put its pages over a later version's.
      - name: No site over a later version's
        if: steps.states.outputs.tag != ''
        env:
          TAG: ${{ steps.states.outputs.tag }}
        working-directory: dotnet
        run: dotnet run --project tools/release/ExGrid.Release -c Release -- site --tag "$TAG"

      # On demand, the released tag is what is built: its pages, its notes, its packages, and the SDK,
      # Node and dependencies it names, set up again from the tag as its release set them up.
      - name: The released tag
        if: steps.states.outputs.on-demand == 'true'
        env:
          TAG: ${{ steps.states.outputs.tag }}
        run: git checkout --detach "refs/tags/$TAG"

      - if: steps.states.outputs.on-demand == 'true'
        uses: ./.github/actions/dotnet

      # On demand from a tag, the site states a version only once a Consumer can install it, as the
      # release's call does by running after both pushes: every package its notes name on nuget.org,
      # and every package the release publishes to npm (pack.mjs's packOrder, as release.yml lists
      # them), at the version. The day is the one nuget.org says it received ExGrid (ADR-0190). Any
      # answer but the package or "not found" refuses too, saying that it could not be checked.
      - name: On nuget.org and npm
        id: registries
        if: steps.states.outputs.on-demand == 'true'
        env:
          VERSION: ${{ steps.states.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { packOrder } from './tools/npm-package/pack.mjs';
            for (const { manifest } of packOrder()) console.log(manifest.name);
          " > "$RUNNER_TEMP/npm-packages.txt"
          python3 - <<'PY'
          import gzip, json, os, sys, urllib.error, urllib.parse, urllib.request

          version = os.environ["VERSION"]
          notes = f"docs/releases/{version}.md"
          if not os.path.exists(notes):
              sys.exit(f"::error::The tag has no {notes}, so it was never released (ADR-0190).")
          lines = [l for l in open(notes, encoding="utf-8").read().splitlines() if l.startswith("Packages: ")]
          if len(lines) != 1:
              sys.exit(f"::error file={notes}::{notes} has no Packages line naming what nuget.org holds (ADR-0190).")
          nuget = [p.strip() for p in lines[0][len("Packages: "):].split(",") if p.strip()]
          with open(os.path.join(os.environ["RUNNER_TEMP"], "npm-packages.txt"), encoding="utf-8") as listed:
              npm = [line.strip() for line in listed if line.strip()]
          if not npm:
              sys.exit("::error::pack.mjs names no package npm publishes, so npm cannot be checked.")

          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=60) as response:
                      body = response.read()
                      return gzip.decompress(body) if body[:2] == b"\x1f\x8b" else body
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  sys.exit(f"::error::{url} answered {e.code}, so whether {version} is published could not be checked. Run the job again.")
              except OSError as e:
                  sys.exit(f"::error::{url} could not be read ({e}), so whether {version} is published could not be checked. Run the job again.")

          missing, day = [], None
          for package in nuget:
              leaf = get(f"https://api.nuget.org/v3/registration5-gz-semver2/{package.lower()}/{version.lower()}.json")
              if leaf is None:
                  missing.append(f"{package} on nuget.org")
              elif package == "ExGrid":
                  day = json.loads(leaf)["published"][:10]
          for package in npm:
              if get(f"https://registry.npmjs.org/{urllib.parse.quote(package, safe='@')}/{version}") is None:
                  missing.append(f"{package} on npm")
          if missing:
              sys.exit(f"::error::{version} is not published in full: {', '.join(missing)} not found. A version's site is published once its release has pushed every package (ADR-0110).")
          if day is None:
              sys.exit(f"::error file={notes}::{notes} does not name ExGrid, whose day on nuget.org the site states (ADR-0190).")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"published-on={day}\n")
          print(f"{version}: {len(nuget)} packages on nuget.org since {day}, {len(npm)} on npm.")
          PY

      # The build reads the three together and refuses inputs that disagree (ADR-0110).
      - name: Publish
        env:
          DOCS_VERSION: ${{ steps.states.outputs.version }}
          DOCS_REF: ${{ steps.states.outputs.ref }}
          DOCS_PUBLISHED_ON: ${{ steps.registries.outputs.published-on || steps.states.outputs.published-on }}
        run: |
          set -euo pipefail
          # From dotnet/, where the SDK finds global.json (ADR-0370 section 9).
          cd dotnet
          dotnet publish samples/ExGrid.Docs/ExGrid.Docs.csproj -c Release -o ../publish \
            "-p:DocsVersion=$DOCS_VERSION" "-p:DocsRef=$DOCS_REF" \
            ${DOCS_PUBLISHED_ON:+"-p:DocsPublishedOn=$DOCS_PUBLISHED_ON"}

      # GitHub Pages serves a project site under /<repository>/. A deep link has no file of its
      # own, so 404.html is the app too; .nojekyll lets _framework/ through. The precompressed
      # copies of index.html would be stale after the rewrite, and Pages does not serve them.
      - name: Prepare for GitHub Pages
        run: |
          site=publish/wwwroot
          sed -i 's#<base href="/" />#<base href="/${{ github.event.repository.name }}/" />#' "$site/index.html"
          grep -q '<base href="/${{ github.event.repository.name }}/" />' "$site/index.html"
          rm -f "$site/index.html.br" "$site/index.html.gz"
          cp "$site/index.html" "$site/404.html"
          touch "$site/.nojekyll"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  # The github-pages environment checks the run's ref against its deployment rules: on the
  # release's call, the caller's ref, which is the tag; on demand, the branch.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
