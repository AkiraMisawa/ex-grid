# Publishes a prerelease of ExGrid and ExGrid.MudBlazor from a v* tag (ADR-0042).
#
#   git tag v0.1.0-beta.1 <a commit on main> && git push origin v0.1.0-beta.1
#
# It refuses a version without a prerelease suffix, which is a release in the Definition of
# Done's sense and waits for its sign-off, and a commit that is not on main. It runs the
# whole of ci.yml on the tag, then pushes to nuget.org the very packages ci.yml's package job
# tested. The key is a one-hour one from Trusted Publishing: nuget.org holds a policy naming
# this repository and this file, and the secret NUGET_USER holds the nuget.org profile name.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admit:
    name: A prerelease, on main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Read the version from the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a prerelease. A version without a suffix is a release, and waits for the Definition of Done's sign-off (ADR-0042)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main (ADR-0042)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: Every layer, and the packages
    needs: admit
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.admit.outputs.version }}
    # ci.yml's badges job asks for contents: write. It never runs on a tag, but a called
    # workflow may not ask for more than its caller grants.
    permissions:
      contents: write

  publish:
    name: Publish to nuget.org
    needs: [admit, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A required reviewer can be added to this environment in the repository's settings.
    environment: nuget
    permissions:
      contents: write   # the GitHub release
      id-token: write   # Trusted Publishing
    env:
      VERSION: ${{ needs.admit.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Exactly the packages the package job tested
        run: |
          set -euo pipefail
          ls -l packages
          for id in ExGrid ExGrid.MudBlazor; do
            for ext in nupkg snupkg; do
              [ -f "packages/$id.$VERSION.$ext" ] || { echo "::error::packages/$id.$VERSION.$ext is missing"; exit 1; }
            done
          done
          [ "$(ls packages | wc -l)" -eq 4 ] || { echo "::error::the artifact holds more than the four expected files"; exit 1; }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The symbol packages go with them. --skip-duplicate lets a re-run finish a push
      # that stopped halfway; nuget.org never replaces a version that is already there.
      - name: Push
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: The GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          status="https://github.com/${{ github.repository }}/blob/${GITHUB_SHA}/docs/implementation-status.md"
          gh release create "$TAG" packages/* \
            --repo "${{ github.repository }}" \
            --verify-tag --prerelease --title "$TAG" --generate-notes \
            --notes "A prerelease (ADR-0042): every test layer passed in CI on this commit, but the Definition of Done has not been signed off. What it still owes is listed in [docs/implementation-status.md at this commit]($status)."
