# Publishes the family's sixteen packages, at one version, from a v* tag (ADR-0042, ADR-0205):
# ExGrid, ExGrid.MudBlazor, ExSheet.Engine, ExSheet, ExSheet.MudBlazor, ExSheet.Xlsx, ExGrid.Data,
# ExGrid.Data.Arrow, ExGrid.Data.Xlsx (ADR-0330), ExPivot.Engine, ExPivot, ExPivot.MudBlazor,
# ExChart.Engine, ExChart and ExChart.MudBlazor (ADR-0283), and ExBoard (ADR-0340).
#
#   git tag v0.1.0-rc.1 <a commit on main or a release/* branch> && git push origin v0.1.0-rc.1
#
# or GitHub's release page, which makes the tag and a release with it; the last step then
# completes that release rather than making another.
#
# What the tag's version is decides what its release must carry. The checks are
# tools/release/ExGrid.Release, whose tests (tests/ExGrid.Release.Tests) are layer 1:
#
# - Every tag: a version as SemVer writes it, on a commit on main or a release/* branch
#   (ADR-0205), whose Release Notes are cut (ADR-0190): docs/releases/<version>.md, its first line
#   the version; no Change Note left under docs/releases/unreleased/; no other version's notes
#   still reading "Published: pending". Then every layer of ci.yml on the tag, whose build holds
#   the Docs Site's Release Notes to the version, and the push of the very packages ci.yml's
#   package job tested.
# - A prerelease (-beta.N and the like): that is all (ADR-0042). Its GitHub release is a
#   prerelease, and its text begins with the prerelease note.
# - A release candidate (-rc.N), so that the stable path is rehearsed before it is used
#   (ADR-0205): besides, ADR-0208's checks before CI's twenty minutes — no Excel case uncertain or
#   documented without a written reason it cannot be asked (an oracleSkip that says why oracle.ps1
#   cannot ask it; not "ask by keys", which oracle.ps1 -Keys asks, nor engineDiffersByDecision), and
#   every row checked by hand holding on a record its code has not changed since, judged at the
#   tagged commit, the record's commit fetched through its verified/* tag, named for the record's
#   directory; WR-10's records naming every stable MudBlazor version nuget.org gives as published
#   and listed within the range the Wrappers declare before X's commit time, or lists and gives no date for — and CI's long run, the soak and ST-1 at 10⁶ rows. Its notes carry a stable version's blocks, its Signed off block in a
#   pending form of its own that says the sign-off is being made against this candidate; ci.yml's
#   build of the Docs Site reads them by form, and refuses the stable form there (ADR-0190,
#   2026-10-12). The release check does not read its Signed off block. Its GitHub release is a
#   prerelease, and its text begins with the candidate's note, not the prerelease note.
# - A version without a suffix, a release in the Definition of Done's sense: besides, its notes'
#   "Signed off" block names a verification/<date>/results.md that is at the tag and the commit X
#   the sign-off was made against, in full, the commit a release candidate of the version was tagged
#   on; the tag differs from X only under verification/ and docs/releases/; and the rows checked by
#   hand are judged at X (ADR-0205, ADR-0208). This replaces the refusal of every version without a
#   suffix that ADR-0042 held until the sign-off. Its GitHub release is a release, with no note
#   before its text.
#
# The key is a one-hour one from Trusted Publishing: nuget.org holds a policy naming this
# repository and this file, and the secret NUGET_USER holds the nuget.org profile name. The GitHub
# release's text is the version's Release Notes. Last, once nuget.org has the packages, the Docs
# Site is published for the version (docs.yml, ADR-0110), with the UTC day of the push (ADR-0190).
# The site describes the latest stable version once one is tagged (ADR-0205), so a version without a
# suffix publishes it when no stable tag is above it by SemVer precedence (a patch to an older line
# does not), and a prerelease only while no version without a suffix is tagged.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admit:
    name: The tag, and what its version must carry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    outputs:
      version: ${{ steps.admit.outputs.version }}
      kind: ${{ steps.admit.outputs.kind }}
      long: ${{ steps.admit.outputs.long }}
      site: ${{ steps.admit.outputs.site }}
    steps:
      # Every branch and every tag: main and release/* for where the tag is; the tags for whether a
      # stable version exists, for the release candidate a stable version's X was tagged as, and for
      # the verified/* tags through which the by-hand records' commits are read (ADR-0208, 2026-10-12).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/dotnet

      # The version and its kind; the branch; whether the long run gates it and whether its release
      # publishes the Docs Site (ADR-0042, ADR-0205).
      - id: admit
        name: The version, and the branch it is on
        run: dotnet run --project tools/release/ExGrid.Release -c Release -- admit --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"

      # Before CI's twenty minutes: a tag publishes all of main, so its commit holds the version's
      # Release Notes and no Change Note, and no other version still waits for its day (ADR-0190).
      # Every refusal is said, not only the first.
      - name: The Release Notes are cut
        env:
          VERSION: ${{ steps.admit.outputs.version }}
        run: |
          set -euo pipefail
          refused=0
          notes="docs/releases/$VERSION.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::The tagged commit has no $notes. Cut the version first: gather the Change Notes into it under its headings, write its Highlights, delete the Change Notes, and write Published: pending (ADR-0190)."
            refused=1
          else
            first=$(head -n 1 "$notes" | tr -d '\r')
            if [[ "$first" != "# $VERSION" ]]; then
              echo "::error file=$notes,line=1::$notes begins '$first', and a version's notes begin '# $VERSION' (ADR-0190)."
              refused=1
            fi
          fi
          while IFS= read -r note; do
            echo "::error file=$note,line=1::$note is a Change Note still waiting: the cut gathers every one into $notes and deletes it, since a tag publishes all of main (ADR-0190)."
            refused=1
          done < <(find docs/releases/unreleased -type f -name '*.md' 2> /dev/null | sort)
          for other in docs/releases/*.md; do
            [[ "$other" == "$notes" || "$other" == docs/releases/prerelease-note.md || "$other" == docs/releases/candidate-note.md ]] && continue
            line=$(tr -d '\r' < "$other" | grep -n -x -m 1 'Published: pending' | cut -d: -f1 || true)
            if [[ -n "$line" ]]; then
              echo "::error file=$other,line=$line::$other still reads Published: pending. The cut of $VERSION writes the UTC day nuget.org received that version (ADR-0190)."
              refused=1
            fi
          done
          exit "$refused"

      # The stable path, for a version without a suffix and for a release candidate, before CI's
      # twenty minutes (ADR-0205, ADR-0208): the sign-off and the structural check (a version without
      # a suffix only), the corpus check, and the rows checked by hand. Run even when the notes were
      # refused, so that one run names everything the tag still needs. A record's commit is read
      # through the verified/* tag its run pushed, verified/ followed by the record's directory; one
      # this clone lacks is asked of the remote, and a tag the remote does not have refuses the tag as
      # unchecked (ADR-0208, 2026-10-12). WR-10's records, the floor record and any later layer-2 run's,
      # name the MudBlazor versions their layer-2 runs covered; nuget.org's registration index gives each
      # version's published date, and each stable one within the range the Wrappers' projects declare,
      # listed and published before X's commit time or given no date, that no record names refuses the tag (an
      # unlisted one is out of the check), as does an index that
      # cannot be read (ADR-0205, ADR-0208, 2026-10-12). The runner reaches nuget.org.
      - name: The stable path's checks
        if: ${{ !cancelled() && steps.admit.outcome == 'success' && steps.admit.outputs.kind != 'prerelease' }}
        run: >-
          dotnet run --project tools/release/ExGrid.Release -c Release -- gate
          --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --fetch-missing
          --mudblazor-index https://api.nuget.org/v3/registration5-gz-semver2/mudblazor/index.json

  verify:
    name: Every layer, and the packages
    needs: admit
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.admit.outputs.version }}
      # The soak on both browsers and both hosts, and ST-1 at 10⁶ rows, for a version without a
      # suffix and a release candidate: the tag's own proof at the commit it publishes (ADR-0205).
      long: ${{ needs.admit.outputs.long == 'true' }}
    # ci.yml's badges job asks for contents: write. It never runs on a tag, but a called
    # workflow may not ask for more than its caller grants.
    permissions:
      contents: write

  publish:
    name: Publish to nuget.org
    needs: [admit, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A required reviewer can be added to this environment in the repository's settings.
    environment: nuget
    permissions:
      contents: write   # the GitHub release
      id-token: write   # Trusted Publishing
    outputs:
      # The UTC day the packages reached nuget.org, for the Docs Site (ADR-0190).
      published-on: ${{ steps.push.outputs.published-on }}
    env:
      VERSION: ${{ needs.admit.outputs.version }}
      KIND: ${{ needs.admit.outputs.kind }}
    steps:
      # The tag's Release Notes, which become the release's text. Checked out first: a checkout
      # empties the workspace.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Exactly the packages the package job tested
        run: |
          set -euo pipefail
          ls -l packages
          ids="ExGrid ExGrid.MudBlazor ExSheet.Engine ExSheet ExSheet.MudBlazor ExSheet.Xlsx ExGrid.Data ExGrid.Data.Arrow ExGrid.Data.Xlsx ExPivot.Engine ExPivot ExPivot.MudBlazor ExChart.Engine ExChart ExChart.MudBlazor ExBoard"
          for id in $ids; do
            for ext in nupkg snupkg; do
              [ -f "packages/$id.$VERSION.$ext" ] || { echo "::error::packages/$id.$VERSION.$ext is missing"; exit 1; }
            done
          done
          [ "$(ls packages | wc -l)" -eq 32 ] || { echo "::error::the artifact holds more than the thirty-two expected files"; exit 1; }

      - uses: ./.github/actions/dotnet

      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The symbol packages go with them. --skip-duplicate lets a re-run finish a push
      # that stopped halfway; nuget.org never replaces a version that is already there.
      # The day is recorded once the push has succeeded: a version's date is the UTC day it
      # reached nuget.org (ADR-0190).
      - name: Push
        id: push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          echo "published-on=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The release's text is the version's Release Notes (ADR-0190), after the candidate's note for a
      # release candidate and the prerelease note for any other prerelease (ADR-0042, ADR-0205; the
      # candidate's note 2026-10-12), and after nothing for a version without a suffix: the files the
      # Docs Site renders, so the two cannot say different things. The first line, the version, is the
      # release's title already; "pending" becomes the day just recorded; a route of the site becomes
      # its whole address; and ADR-NNNN links the record at this commit, as the site links it. GitHub links #NN to the pull request itself. These rewrites
      # see no Markdown structure, so the site's build refuses what they would render otherwise than the
      # site does (NotesMarkdown, EXDOCS007): an ADR-NNNN inside a link's text, in a code span or joined to
      # the text before it, a ]( in a code span, a bare address, and an @ joined to a name.
      - name: The release's text
        env:
          PUBLISHED_ON: ${{ steps.push.outputs.published-on }}
          REPO: ${{ github.repository }}
          SITE: https://akiramisawa.github.io/ex-grid/
        run: |
          set -euo pipefail
          {
            case "$KIND" in
              candidate) cat docs/releases/candidate-note.md; echo ;;
              prerelease) cat docs/releases/prerelease-note.md; echo ;;
            esac
            tail -n +2 "docs/releases/$VERSION.md"
          } | perl -pe '
            s/\r$//;
            $body = 1 if /^## /;
            s/\{ref\}/$ENV{GITHUB_SHA}/g;
            unless ($body) {
              s/^Published: pending$/Published: $ENV{PUBLISHED_ON}/;
              s/^(Published|Packages|Target): (.*)$/**$1:** $2  /;
            }
            s{\]\((?!https://)([^)\s]+)\)}{]($ENV{SITE}$1)}g;
            s{(?<![\w\[/-])ADR-(\d{4})(?!\w)}{my @f = glob("docs/adr/$1-*.md"); @f ? "[ADR-$1](https://github.com/$ENV{REPO}/blob/$ENV{GITHUB_SHA}/$f[0])" : "ADR-$1"}ge;
          ' > "$RUNNER_TEMP/release-notes.md"
          # A GitHub release holds 125,000 characters of text, and 0.1.0-rc.1's notes did not fit (its
          # release was refused after its packages were on nuget.org). Notes that do not fit keep, in
          # their order, what opens them, the Highlights, Known limitations and a stable version's four
          # blocks (ADR-0205), and as many of the other sections as fit; each section left out keeps its
          # heading and links the whole notes at this commit (ADR-0042's note of 2026-10-18).
          python3 - "$RUNNER_TEMP/release-notes.md" <<'PY'
          import os, re, sys
          path = sys.argv[1]
          text = open(path, encoding='utf-8').read()
          LIMIT = 120_000   # GitHub's 125,000, less room for what the release page adds
          if len(text) > LIMIT:
              kept = ('Highlights', 'Known limitations', 'Signed off', 'SHOULD criteria accepted failing',
                      'Out of scope for this version', 'Supported')
              parts = re.split(r'(?m)^(?=## )', text)
              head, sections = parts[0], parts[1:]
              whole = (f"https://github.com/{os.environ['REPO']}/blob/{os.environ['GITHUB_SHA']}"
                       f"/docs/releases/{os.environ['VERSION']}.md")
              def heading(s): return s.split('\n', 1)[0][3:].strip()
              def anchor(s): return re.sub(r'[^a-z0-9 -]', '', heading(s).lower()).replace(' ', '-')
              def stub(s): return f"## {heading(s)}\n\nIn [the whole Release Notes]({whole}#{anchor(s)}): too long for a GitHub release.\n\n"
              lead = (f"These notes are longer than a GitHub release holds. Each section shortened below is in "
                      f"[the whole Release Notes]({whole}).\n\n")
              out = [stub(s) for s in sections]
              used = len(head) + len(lead) + sum(len(o) for o in out)
              for i, s in enumerate(sections):
                  if heading(s) in kept:
                      used += len(s) - len(out[i]); out[i] = s
              for i, s in enumerate(sections):
                  if heading(s) not in kept and used + len(s) - len(out[i]) <= LIMIT:
                      used += len(s) - len(out[i]); out[i] = s
              text = head + lead + ''.join(out)
              if len(text) > LIMIT:
                  sys.exit(f'::error::The release text is {len(text)} characters with only its kept sections whole; a GitHub release holds 125,000.')
              open(path, 'w', encoding='utf-8').write(text)
              print(f'::notice::The Release Notes are shortened to {len(text)} characters for the GitHub release.')
          PY
          cat "$RUNNER_TEMP/release-notes.md"

      # Whoever made the tag may have made its release too — GitHub's release page does both at once.
      # Then that release is completed, not refused: marked a prerelease or a release, the packages
      # attached, and its text replaced by the Release Notes (ADR-0190; ADR-0042's 2026-09-25 record).
      # A version without a suffix is a release, not a prerelease (ADR-0205).
      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$KIND" == stable ]]; then
            prerelease=--prerelease=false
          else
            prerelease=--prerelease
          fi
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" "$prerelease" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" packages/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" packages/* --repo "$REPO" \
              --verify-tag "$prerelease" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  # The Docs Site for this version, once nuget.org has it (ADR-0110, ADR-0042): the site states a
  # version only after its packages can be installed, and the day they could be (ADR-0190).
  # Trusted Publishing stays in the publish job above, since nuget.org's policy names this file.
  # The site describes the latest stable version once one is tagged (ADR-0205): a prerelease then
  # publishes none, its notes being on its GitHub release, and neither does a stable version some
  # stable tag is above, a patch to an older line. The admit job decides it, and says so.
  docs:
    name: The Docs Site
    needs: [admit, publish]
    if: needs.admit.outputs.site == 'true'
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.admit.outputs.version }}
      ref: ${{ github.ref_name }}
      published-on: ${{ needs.publish.outputs.published-on }}
    # What a Pages deployment needs. A called workflow may not ask for more than its caller grants.
    permissions:
      contents: read
      pages: write
      id-token: write
