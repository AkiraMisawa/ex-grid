# Publishes a prerelease of the family's ten packages, at one version, from a v* tag (ADR-0042):
# ExGrid, ExGrid.MudBlazor, ExSheet.Engine, ExSheet, ExSheet.MudBlazor, ExGrid.Data,
# ExGrid.Data.Arrow, ExPivot.Engine, ExPivot and ExPivot.MudBlazor.
#
#   git tag v0.1.0-beta.1 <a commit on main> && git push origin v0.1.0-beta.1
#
# or GitHub's release page, which makes the tag and a release with it; the last step then
# completes that release rather than making another.
#
# It refuses a version without a prerelease suffix, which is a release in the Definition of
# Done's sense and waits for its sign-off, and a commit that is not on main. It refuses, too, a
# commit whose Release Notes are not cut (ADR-0190): no docs/releases/<version>.md, or one whose
# first line is not the version; a Change Note left under docs/releases/unreleased/; or another
# version's notes still reading "Published: pending". It runs the whole of ci.yml on the tag,
# whose build holds the Docs Site's Release Notes to the version, then pushes to nuget.org the
# very packages ci.yml's package job tested. The key is a one-hour one from Trusted Publishing:
# nuget.org holds a policy naming this repository and this file, and the secret NUGET_USER holds
# the nuget.org profile name. The GitHub release's text is the version's Release Notes, after the
# prerelease note. Last, once nuget.org has the packages, it publishes the Docs Site for the
# version (docs.yml, ADR-0110), with the UTC day of the push (ADR-0190).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admit:
    name: A prerelease, on main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Read the version from the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a prerelease. A version without a suffix is a release, and waits for the Definition of Done's sign-off (ADR-0042)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main (ADR-0042)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Before CI's twenty minutes: a tag publishes all of main, so its commit holds the version's
      # Release Notes and no Change Note, and no other version still waits for its day (ADR-0190).
      # Every refusal is said, not only the first.
      - name: The Release Notes are cut
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          refused=0
          notes="docs/releases/$VERSION.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::The tagged commit has no $notes. Cut the version first: gather the Change Notes into it under its headings, write its Highlights, delete the Change Notes, and write Published: pending (ADR-0190)."
            refused=1
          else
            first=$(head -n 1 "$notes" | tr -d '\r')
            if [[ "$first" != "# $VERSION" ]]; then
              echo "::error file=$notes,line=1::$notes begins '$first', and a version's notes begin '# $VERSION' (ADR-0190)."
              refused=1
            fi
          fi
          while IFS= read -r note; do
            echo "::error file=$note,line=1::$note is a Change Note still waiting: the cut gathers every one into $notes and deletes it, since a tag publishes all of main (ADR-0190)."
            refused=1
          done < <(find docs/releases/unreleased -type f -name '*.md' 2> /dev/null | sort)
          for other in docs/releases/*.md; do
            [[ "$other" == "$notes" || "$other" == docs/releases/prerelease-note.md ]] && continue
            line=$(tr -d '\r' < "$other" | grep -n -x -m 1 'Published: pending' | cut -d: -f1 || true)
            if [[ -n "$line" ]]; then
              echo "::error file=$other,line=$line::$other still reads Published: pending. The cut of $VERSION writes the UTC day nuget.org received that version (ADR-0190)."
              refused=1
            fi
          done
          exit "$refused"

  verify:
    name: Every layer, and the packages
    needs: admit
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.admit.outputs.version }}
    # ci.yml's badges job asks for contents: write. It never runs on a tag, but a called
    # workflow may not ask for more than its caller grants.
    permissions:
      contents: write

  publish:
    name: Publish to nuget.org
    needs: [admit, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A required reviewer can be added to this environment in the repository's settings.
    environment: nuget
    permissions:
      contents: write   # the GitHub release
      id-token: write   # Trusted Publishing
    outputs:
      # The UTC day the packages reached nuget.org, for the Docs Site (ADR-0190).
      published-on: ${{ steps.push.outputs.published-on }}
    env:
      VERSION: ${{ needs.admit.outputs.version }}
    steps:
      # The tag's Release Notes, which become the release's text. Checked out first: a checkout
      # empties the workspace.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Exactly the packages the package job tested
        run: |
          set -euo pipefail
          ls -l packages
          ids="ExGrid ExGrid.MudBlazor ExSheet.Engine ExSheet ExSheet.MudBlazor ExGrid.Data ExGrid.Data.Arrow ExPivot.Engine ExPivot ExPivot.MudBlazor"
          for id in $ids; do
            for ext in nupkg snupkg; do
              [ -f "packages/$id.$VERSION.$ext" ] || { echo "::error::packages/$id.$VERSION.$ext is missing"; exit 1; }
            done
          done
          [ "$(ls packages | wc -l)" -eq 20 ] || { echo "::error::the artifact holds more than the twenty expected files"; exit 1; }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The symbol packages go with them. --skip-duplicate lets a re-run finish a push
      # that stopped halfway; nuget.org never replaces a version that is already there.
      # The day is recorded once the push has succeeded: a version's date is the UTC day it
      # reached nuget.org (ADR-0190).
      - name: Push
        id: push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          echo "published-on=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The release's text is the version's Release Notes (ADR-0190), after the prerelease note for a
      # prerelease (ADR-0042): the files the Docs Site renders, so the two cannot say different things.
      # The first line, the version, is the release's title already; "pending" becomes the day just
      # recorded; a route of the site becomes its whole address; and ADR-NNNN links the record at
      # this commit, as the site links it. GitHub links #NN to the pull request itself.
      - name: The release's text
        env:
          PUBLISHED_ON: ${{ steps.push.outputs.published-on }}
          REPO: ${{ github.repository }}
          SITE: https://akiramisawa.github.io/ex-grid/
        run: |
          set -euo pipefail
          {
            if [[ "$VERSION" == *-* ]]; then
              cat docs/releases/prerelease-note.md
              echo
            fi
            tail -n +2 "docs/releases/$VERSION.md"
          } | perl -pe '
            s/\r$//;
            $body = 1 if /^## /;
            s/\{ref\}/$ENV{GITHUB_SHA}/g;
            unless ($body) {
              s/^Published: pending$/Published: $ENV{PUBLISHED_ON}/;
              s/^(Published|Packages|Target): (.*)$/**$1:** $2  /;
            }
            s{\]\((?!https://)([^)\s]+)\)}{]($ENV{SITE}$1)}g;
            s{(?<![\w\[/-])ADR-(\d{4})(?!\w)}{my @f = glob("docs/adr/$1-*.md"); @f ? "[ADR-$1](https://github.com/$ENV{REPO}/blob/$ENV{GITHUB_SHA}/$f[0])" : "ADR-$1"}ge;
          ' > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      # Whoever made the tag may have made its release too — GitHub's release page does both at once.
      # Then that release is completed, not refused: marked prerelease, the packages attached, and its
      # text replaced by the Release Notes (ADR-0190; ADR-0042's 2026-09-25 record).
      - name: The GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" packages/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" packages/* --repo "$REPO" \
              --verify-tag --prerelease --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  # The Docs Site for this version, once nuget.org has it (ADR-0110, ADR-0042): the site states a
  # version only after its packages can be installed, and the day they could be (ADR-0190).
  # Trusted Publishing stays in the publish job above, since nuget.org's policy names this file.
  docs:
    name: The Docs Site
    needs: [admit, publish]
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.admit.outputs.version }}
      ref: ${{ github.ref_name }}
      published-on: ${{ needs.publish.outputs.published-on }}
    # What a Pages deployment needs. A called workflow may not ask for more than its caller grants.
    permissions:
      contents: read
      pages: write
      id-token: write
