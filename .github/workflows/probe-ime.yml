# Temporary: whether GitHub's hosted Windows runner can run ED-30 with a real Microsoft IME (ADR-0450).
# Removed before the branch's pull request.
name: Probe IME
on:
  push:
    branches: [claude/project-thread-r6u9gd]
    paths: ['tools/probe-ime/**', '.github/workflows/probe-ime.yml']
jobs:
  ime:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults: { run: { shell: pwsh, working-directory: tools/probe-ime } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - run: npm init -y > $null; npm i playwright-core@1.62.1 --no-audit --no-fund
      - name: 1920x1080
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Japanese input
        continue-on-error: true
        run: ./install.ps1
      - name: Compose on Chrome
        continue-on-error: true
        run: node ime.mjs chrome
      - name: Compose on Edge
        continue-on-error: true
        run: node ime.mjs msedge
