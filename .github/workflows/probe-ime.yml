# Temporary: whether GitHub's hosted Windows runner can run ED-30 with a real Microsoft IME (ADR-0450).
# Removed before the branch's pull request.
name: Probe IME
on:
  push:
    branches: [claude/project-thread-r6u9gd]
    paths: ['tools/probe-ime/**', '.github/workflows/probe-ime.yml']
jobs:
  ime:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version }
      - run: npm ci --no-audit --no-fund
      - name: The React host
        working-directory: samples/ExGrid.DemoHost.React
        run: npm run build
      - name: Serve it
        run: Start-Process node -ArgumentList 'tests/browser/static-host.mjs','samples/ExGrid.DemoHost.React/dist','5297' -WindowStyle Hidden
      - name: 1920x1080
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Japanese input
        timeout-minutes: 35
        working-directory: tools/probe-ime
        run: ./install.ps1
      - name: Compose on Edge
        continue-on-error: true
        timeout-minutes: 5
        working-directory: tools/probe-ime
        run: node ime.mjs msedge http://localhost:5297
      - name: Compose on Chrome
        continue-on-error: true
        timeout-minutes: 5
        working-directory: tools/probe-ime
        run: node ime.mjs chrome http://localhost:5297
