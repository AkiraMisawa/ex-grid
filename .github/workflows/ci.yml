# Every layer, on every push to main and on every pull request that changes more than documents
# (ADR-0041). Layers 1 and 2 with coverage; layer 3 on the runner's installed Chrome and
# Edge, headed under xvfb, as ADR-0026 asks, split by browser and into shards that each
# run on a runner of their own. All three gate; coverage is reported, never gated. The
# weekly run adds the soak and ST-1 at 10⁶ rows, and so does the release of a version
# without a suffix or a release candidate (ADR-0205). The packages are packed and taken by
# an application as a Consumer takes them (ADR-0042), NuGet's by the package job and npm's by the
# script-core job; the release workflow calls this one and publishes exactly what those jobs tested.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly long run: Monday 03:17 UTC.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      long:
        description: 'Also run the soak (MEM-5/6) and ST-1 at 10⁶ rows'
        type: boolean
        default: false
      desktops:
        description: 'Also run the rows once checked by hand, on the Windows and macOS desktops and at the MudBlazor floor (WR-10), as the long run does (ADR-0450)'
        type: boolean
        default: false
  # From release.yml, on a v* tag: the version is the tag's (ADR-0042).
  workflow_call:
    inputs:
      version:
        description: 'The version the package job packs'
        type: string
        default: ''
      long:
        description: 'Also run the soak and ST-1 at 10⁶ rows: a version without a suffix, and a release candidate (ADR-0205)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  # The long run: the weekly schedule, or a dispatch that asks for it.
  LONG_RUN: ${{ github.event_name == 'schedule' || inputs.long == true }}

jobs:
  # Whether layer 3 has anything to judge (ADR-0041). A pull request that changes only documents
  # (`docs/`, and Markdown at the root) changes nothing the browser suite runs: the hosts it drives
  # read no file there. Its hosts, its shards and its repeats are skipped, and the verdicts read
  # that skip as passed. Layers 1 and 2 still run, because the Docs Site's generator tests read
  # those documents. Every other event, a push to main and a release among them, runs everything.
  changes:
    name: What the change touches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      layer3: ${{ steps.which.outputs.layer3 }}
      desktops: ${{ steps.which.outputs.desktops }}
      floor: ${{ steps.which.outputs.floor }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request's HEAD is its merge commit, whose first parent is the base's tip.
          fetch-depth: 2

      - name: Whether anything outside the documents changed
        id: which
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "${EVENT}" != pull_request ]; then
            echo "layer3=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The desktop rows' own machinery (ADR-0450): a pull request that changes it runs them, so a
          # change to them is proved before a release candidate first needs them.
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(tests/browser/(os-input\.mjs|windows/.*|windows-desktop\.spec\.mjs)|\.github/workflows/ci\.yml)$'; then
            echo "desktops=true" >> "$GITHUB_OUTPUT"
          fi
          # WR-10's runs (ADR-0450's note of 2026-11-02): a pull request that changes a Wrapper, or how the
          # runs read the range it declares, runs them.
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(dotnet/src/[^/]+\.MudBlazor/.*|tools/scripts/mudblazor-range\.mjs|\.github/workflows/ci\.yml)$'; then
            echo "floor=true" >> "$GITHUB_OUTPUT"
          fi
          others=$(git diff --name-only HEAD^1 HEAD | grep -vE '^(docs/.*|[^/]+\.md)$' || true)
          if [ -z "${others}" ]; then
            echo "layer3=false" >> "$GITHUB_OUTPUT"
            echo "Layer 3 skipped: this pull request changes only documents." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "layer3=true" >> "$GITHUB_OUTPUT"
            printf 'Outside the documents:\n%s\n' "${others}"
          fi

  tests:
    name: Build, layers 1 and 2, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every dotnet command runs in dotnet/, where the SDK finds global.json and the tool manifest
    # (ADR-0370 section 9).
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7

      # The SDK's own runtime is the one the gating tests execute on: net10.0 (ADR-0022).
      - uses: ./.github/actions/dotnet

      - name: Restore tools
        run: dotnet tool restore

      # The Docs Site's build is told the version a tag publishes, and then holds the Release Notes to
      # it (ADR-0190): that version's notes exist and are the newest, and no Change Note is left. On
      # any other run there is no version to publish, and "dev" builds it as a local build.
      - name: Build
        env:
          DOCS_VERSION: ${{ inputs.version || 'dev' }}
        run: dotnet build ExGrid.slnx -p:DocsVersion="$DOCS_VERSION"

      - name: Layers 1 and 2, with coverage
        run: >
          dotnet test ExGrid.slnx --no-build
          -p:TestingPlatformCommandLineArguments="--coverage --coverage-output-format cobertura
          --coverage-output coverage.cobertura.xml --coverage-settings ${{ github.workspace }}/dotnet/tests/coverage.settings.xml"

      - name: Merge coverage
        run: >
          dotnet reportgenerator
          -reports:"tests/*/bin/*/*/TestResults/coverage.cobertura.xml"
          -targetdir:coverage
          -reporttypes:"MarkdownSummaryGithub;Badges;TextSummary"

      # The same reports, once per product: its packages by their exact names, so ExGrid's
      # figure never takes in ExGrid.Data's. The total above is all ten.
      - name: Coverage per product
        run: |
          set -euo pipefail
          product() {
            dotnet reportgenerator \
              -reports:"tests/*/bin/*/*/TestResults/coverage.cobertura.xml" \
              -targetdir:"coverage/products/$1" \
              -assemblyfilters:"$2" \
              -reporttypes:"TextSummary"
          }
          product ExGrid  "+ExGrid;+ExGrid.MudBlazor"
          product ExSheet "+ExSheet;+ExSheet.Engine;+ExSheet.MudBlazor;+ExSheet.Xlsx"
          product ExPivot "+ExPivot;+ExPivot.Engine;+ExPivot.MudBlazor"
          product ExChart "+ExChart;+ExChart.Engine;+ExChart.MudBlazor"
          product ExBoard "+ExBoard"
          product Data    "+ExGrid.Data;+ExGrid.Data.Arrow;+ExGrid.Data.Xlsx"
          {
            echo '## Coverage per product'
            echo
            echo '| Product | Line | Branch |'
            echo '|---|---|---|'
            for name in ExGrid ExSheet ExPivot ExChart ExBoard Data; do
              summary="coverage/products/$name/Summary.txt"
              echo "| $name | $(grep -oP 'Line coverage: \K[0-9.]+' "$summary")% | $(grep -oP 'Branch coverage: \K[0-9.]+' "$summary")% |"
            done
            echo
          } > coverage/products/Summary.md

      - name: Coverage into the run's summary
        run: cat coverage/products/Summary.md coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: dotnet/coverage/
          retention-days: 30

  # The npm workspace at the repository's root (ADR-0350, section 13, ADR-0370 section 9): its packages' sources and
  # tests type-checked, each
  # package built with its public surface held to its report (API Extractor, the counterpart of
  # PublicAPI.Unshipped.txt), and Vitest's layers 1 and 2, whose layer-1 cases are the JSON under
  # tests/cases/ that the tests job runs against the C# core.
  script-core:
    name: Script Core, layers 1 and 2 (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the workspace
        run: npm ci

      - name: Type-check the sources and the tests
        run: npm run typecheck

      - name: Lint, held to its own fixtures first
        run: npm run lint

      - name: Build, and hold each package's public surface to its report
        run: npm run build

      # The long run takes ST-1 at 10⁶ rows too (grid-consistency.test.ts, ADR-0205).
      - name: Layers 1 and 2
        env:
          EXGRID_ST1_MILLION: ${{ env.LONG_RUN == 'true' && '1' || '' }}
        run: npm test

      # The npm packages packed at the version and taken by an application as a Consumer takes them (ADR-0042,
      # ADR-0370 section 9), the counterpart of the package job's check of NuGet's: every tarball read back, its
      # imports declared and its stylesheet the NuGet package's, then installed outside the workspace, type-checked,
      # bundled and run (tools/npm-package/check.mjs).
      - name: The npm packages, taken as a Consumer takes them
        run: node tools/npm-package/check.mjs "${{ inputs.version || format('0.0.0-ci.{0}', github.run_number) }}"

      # What the release publishes to npm: these files, not a rebuild, in publish-order.txt's order. Kept only for
      # the release, which alone reads them. The directory is a dot directory, which upload-artifact skips unless
      # told otherwise.
      - if: inputs.version
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: tools/npm-package/.tarballs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      # ExPivot's engine held to the C# engine on random inputs (ADR-0370, section 2): dotnet/tools/pivot-oracle
      # answers what .NET and ExPivot.Engine give. The seed is fixed, so the gate answers alike on every
      # run; another seed is drawn by hand with EXGRID_PIVOT_SEED (packages/pivot-engine/differential/README.md).
      # The oracle runs on the flake's .NET, whose ICU is the one the Script Core's culture table was written
      # from: the runner's own ICU is another version, and formats en-ZA otherwise (1.5 against 1,5).
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the pivot oracle on the flake's .NET
        run: |
          nix develop -c bash -c 'cd dotnet && dotnet build tools/pivot-oracle -c Release'
          echo "PIVOT_DOTNET=$(nix develop -c bash -c 'command -v dotnet' | tail -n 1)" >> "$GITHUB_ENV"

      - name: ExPivot's engine against the C# engine (differential)
        working-directory: packages/pivot-engine
        env:
          EXGRID_PIVOT_SEED: 20261025
        run: EXGRID_PIVOT_ORACLE="$PIVOT_DOTNET ${{ github.workspace }}/dotnet/tools/pivot-oracle/bin/Release/net10.0/ExPivot.Oracle.dll serve" npm run differential

      # ExSheet's formula engine held to the C# engine on random Sheets the same way (ADR-0370, section 2):
      # dotnet/tools/sheet-oracle answers what ExSheet.Engine gives, on the same flake .NET, under a fixed seed
      # (packages/sheet-engine/differential/README.md).
      - name: Build the sheet oracle on the flake's .NET
        run: nix develop -c bash -c 'cd dotnet && dotnet build tools/sheet-oracle -c Release'

      - name: ExSheet's engine against the C# engine (differential)
        working-directory: packages/sheet-engine
        env:
          EXGRID_SHEET_SEED: 20261026
        run: EXGRID_SHEET_ORACLE="$PIVOT_DOTNET ${{ github.workspace }}/dotnet/tools/sheet-oracle/bin/Release/net10.0/ExSheet.Oracle.dll serve" npm run differential

  # The hosts layer 3 drives, published once in Release and handed to every runner that drives
  # them: the WebAssembly DemoHost, the Server host and the demo API server (ADR-0069), as
  # `dotnet publish -c Release` writes them, which is how a Consumer deploys. The suite starts
  # them from EXGRID_HOSTS (playwright.config.mjs) instead of `dotnet run`; the environment they
  # run in stays Development, as under `dotnet run`, so what changes is only how they are built.
  hosts:
    name: Layer 3's hosts, published in Release
    needs: changes
    if: needs.changes.outputs.layer3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dotnet

      - name: Publish the WebAssembly DemoHost
        working-directory: dotnet
        run: dotnet publish samples/ExGrid.DemoHost -c Release -o ../hosts/wasm

      - name: Publish the Server host
        working-directory: dotnet
        run: dotnet publish samples/ExGrid.DemoHost.Server -c Release -o ../hosts/server

      - name: Publish the demo API server
        working-directory: dotnet
        run: dotnet publish samples/ExGrid.DemoApi -c Release -o ../hosts/api

      # The React DemoHost (ADR-0350 section 13): the Script Core and its React adapter built from
      # source by Vite, as a Consumer's bundler builds them, into static files. Its dependencies are the
      # npm workspace's, which the .NET action installed.
      - name: Build the React DemoHost
        working-directory: samples/ExGrid.DemoHost.React
        run: |
          npm run typecheck
          npm run build
          cp -r dist ../../hosts/react

      - uses: actions/upload-artifact@v7
        with:
          name: layer3-hosts
          path: hosts/
          if-no-files-found: error
          retention-days: 7

  # Layer 3's Blazor specs on the WebAssembly host (ADR-0370 section 11: the behaviour specs are
  # the React host's) in five parts: each project (both browsers, and chrome-150's Layout Ceiling
  # selection, ADR-0053) in shards, each on a runner of its own — two for each browser and one for
  # chrome-150's few tests. The suite is the one playwright.config.mjs defines, unchanged;
  # --project and --shard only choose which files a runner takes, and a shard is a set of whole
  # spec files, so what a run shares — the OS clipboard, the records, a spec file's booted app
  # (ADR-0056) — is never split between runners (ADR-0041).
  browser:
    name: Layer 3 on ${{ matrix.project }}, shard ${{ matrix.shard }}/${{ matrix.project == 'chrome-150' && 1 || 2 }} (Linux, headed)
    needs: hosts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chrome, msedge, chrome-150]
        shard: [1, 2]
        exclude:
          - { project: chrome-150, shard: 2 }
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dotnet

      - name: The installed browsers the suite resolves by channel
        run: |
          google-chrome --version
          microsoft-edge --version

      # The hosts the hosts job published, among them the demo API server the pages call
      # (ADR-0069), which the suite starts beside the host. Its first start on a fresh runner
      # generates the 20,000 trades the suite asks for, which takes about a second, well inside
      # the webServer's timeout.
      - uses: actions/download-artifact@v8
        with:
          name: layer3-hosts
          path: hosts

      # The screen is larger than any window the suite opens, so the chrome-150 project
      # (ADR-0053: Chrome at --force-device-scale-factor=1.5, its viewport left to the
      # window) gets its 1280x800 window whole — 1920x1200 device pixels.
      - name: Layer 3, headed under xvfb
        working-directory: tests/browser
        env:
          EXGRID_HOSTS: ${{ github.workspace }}/hosts
          EXGRID_SOAK: ${{ env.LONG_RUN == 'true' && '1' || '' }}
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 2560x1600x24"
          npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.project == 'chrome-150' && 1 || 2 }}

      - name: Keep the run's records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layer3-records-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            verification/
            tests/browser/test-results/
          if-no-files-found: ignore
          retention-days: 30

  # The check the WebAssembly run has always been, green only when every shard of it was.
  # Always run: a job its `if` skips counts as passed for a required check, so a cancelled or
  # skipped layer 3 would otherwise read as green. The one skip it passes is the changes job's.
  browser-verdict:
    name: Layer 3 on Chrome and Edge (Linux, headed)
    needs: [changes, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Passed when every shard did, or when a pull request of documents alone skipped them all.
      - name: Every shard passed
        run: >
          test "${{ needs.browser.result }}" = success ||
          { test "${{ needs.changes.outputs.layer3 }}" = false && test "${{ needs.browser.result }}" = skipped; }

  # Layer 3's behaviour specs against the React DemoHost (ADR-0350 section 13, ADR-0370 section
  # 11): the Script Core under the built-in Chrome, with data the page holds, judged once for
  # every adapter, and the React Wrappers' own specs. Both browsers, and chrome-150's Layout
  # Ceiling selection (ADR-0053). Not sharded: each project's run takes about twenty minutes.
  browser-react:
    name: Layer 3 against the React host on ${{ matrix.project }} (Linux, headed)
    needs: hosts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chrome, msedge, chrome-150]
    steps:
      - uses: actions/checkout@v7

      # The React host's /pivot-db asks the demo API server, which runs published under .NET.
      - uses: ./.github/actions/dotnet

      - name: The installed browsers the suite resolves by channel
        run: |
          google-chrome --version
          microsoft-edge --version

      - uses: actions/download-artifact@v8
        with:
          name: layer3-hosts
          path: hosts

      - name: Layer 3 against the React host, headed under xvfb
        working-directory: tests/browser
        env:
          EXGRID_HOSTS: ${{ github.workspace }}/hosts
          EXGRID_HOSTING: react
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 2560x1600x24"
          npx playwright test --project=${{ matrix.project }}

      - name: Keep the run's records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layer3-records-react-${{ matrix.project }}
          path: |
            verification/
            tests/browser/test-results/
          if-no-files-found: ignore
          retention-days: 30

  # The Blazor specs against the Blazor Server host (ADR-0019, Definition of Done SRV-2):
  # every page served over a circuit, prerendered, behind latency-proxy.mjs, with the host's
  # own log read for CON-6. Split the same way, with a verdict job of its own, so the
  # WebAssembly run keeps its check name.
  # The React host's run holds the behaviour specs, which no other host runs (ADR-0370 section 11),
  # so it is judged the way the Blazor hosts' runs are, by one check that is never skipped.
  browser-react-verdict:
    name: Layer 3 on Chrome and Edge against the React host (Linux, headed)
    needs: [changes, browser-react]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Passed when every project did, or when a pull request of documents alone skipped them all.
      - name: Every project passed
        run: >
          test "${{ needs.browser-react.result }}" = success ||
          { test "${{ needs.changes.outputs.layer3 }}" = false && test "${{ needs.browser-react.result }}" = skipped; }

  browser-server:
    name: Layer 3 against the Server host on ${{ matrix.project }}, shard ${{ matrix.shard }}/${{ matrix.project == 'chrome-150' && 1 || 2 }} (Linux, headed)
    needs: hosts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chrome, msedge, chrome-150]
        shard: [1, 2]
        exclude:
          - { project: chrome-150, shard: 2 }
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dotnet

      - name: The installed browsers the suite resolves by channel
        run: |
          google-chrome --version
          microsoft-edge --version

      # As beside the WebAssembly host: the published hosts, the demo API server started with
      # 20,000 trades.
      - uses: actions/download-artifact@v8
        with:
          name: layer3-hosts
          path: hosts

      - name: Layer 3 against the Server host, headed under xvfb
        working-directory: tests/browser
        env:
          EXGRID_HOSTS: ${{ github.workspace }}/hosts
          EXGRID_HOSTING: server
          EXGRID_SOAK: ${{ env.LONG_RUN == 'true' && '1' || '' }}
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 2560x1600x24"
          npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.project == 'chrome-150' && 1 || 2 }}

      - name: Keep the run's records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layer3-records-server-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            verification/
            tests/browser/test-results/
          if-no-files-found: ignore
          retention-days: 30

  browser-server-verdict:
    name: Layer 3 on Chrome and Edge against the Server host (Linux, headed)
    needs: [changes, browser-server]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Passed when every shard did, or when a pull request of documents alone skipped them all.
      - name: Every shard passed
        run: >
          test "${{ needs.browser-server.result }}" = success ||
          { test "${{ needs.changes.outputs.layer3 }}" = false && test "${{ needs.browser-server.result }}" = skipped; }

  # The rows the Definition of Done once checked by hand on a Windows desktop (ADR-0450), on the
  # hosted runner's own desktop: an interactive session whose display scale is set the way Settings
  # sets it, and keys sent through Windows' input queue, so the browser meets them before the page
  # does. At 100%, SH-42, SH-51 and SH-52's browser keys, and FN-12e's painting; at 125% and at 150%,
  # VZ-14 with the OS doing the scaling; at 150%, VZ-16's real zoom to 2.25. The long run's, and a
  # dispatch that asks for it: release.yml calls the long run for a release candidate and a version
  # without a suffix, so these gate both. A pull request that changes their own files runs them too.
  windows-desktop:
    name: The Windows desktop rows (VZ-14, VZ-16, FN-12e, SH-42, SH-51, SH-52)
    needs: [changes, hosts]
    if: github.event_name == 'schedule' || inputs.long == true || inputs.desktops == true || needs.changes.outputs.desktops == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      EXGRID_HOSTS: ${{ github.workspace }}/hosts
    steps:
      - uses: actions/checkout@v7

      # The hosts run published; the demo API server beside them runs under .NET.
      - uses: ./.github/actions/dotnet

      - name: The installed browsers the suite resolves by channel
        run: |
          (Get-Item "${env:ProgramFiles}/Google/Chrome/Application/chrome.exe").VersionInfo.ProductVersion
          (Get-Item "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe").VersionInfo.ProductVersion

      - uses: actions/download-artifact@v8
        with:
          name: layer3-hosts
          path: hosts

      # The runner's display starts at 1024x768, where Windows offers no scale above 100%.
      - name: The display at 1920x1080
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: At 100%, the browser's own keys and FN-12e
        working-directory: tests/browser
        run: |
          ./windows/display-scale.ps1 -Set 100
          $env:EXGRID_DISPLAY_SCALE = '100'
          $env:EXGRID_HOSTING = 'react'
          npx playwright test windows-desktop.spec.mjs sizing.spec.mjs part-c.spec.mjs --grep "ADR-0450|FN-12e" --project=chrome --project=msedge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:EXGRID_HOSTING = 'wasm'
          npx playwright test windows-desktop.spec.mjs --grep "SH-52" --project=chrome --project=msedge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: At 125%, VZ-14
        working-directory: tests/browser
        run: |
          ./windows/display-scale.ps1 -Set 125
          $env:EXGRID_DISPLAY_SCALE = '125'
          $env:EXGRID_HOSTING = 'react'
          npx playwright test scrollbar.spec.mjs --grep "fractional display scaling" --project=chrome --project=msedge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: At 150%, VZ-14 and VZ-16
        working-directory: tests/browser
        run: |
          ./windows/display-scale.ps1 -Set 150
          $env:EXGRID_DISPLAY_SCALE = '150'
          $env:EXGRID_HOSTING = 'react'
          npx playwright test scrollbar.spec.mjs windows-desktop.spec.mjs --grep "fractional display scaling|VZ-16" --project=chrome --project=msedge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Keep the run's records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layer3-records-windows-desktop
          path: |
            verification/
            tests/browser/test-results/
          if-no-files-found: ignore
          retention-days: 30

  # The rows the Definition of Done once checked by hand on a Mac (ADR-0450): KB-3, where
  # ControlOrMeta presses Command, on every key path that fills with it, the editor's included, and
  # the two Apple-only caret keys; and FN-12e's painting in macOS's own faces. Headed, on the runner's
  # desktop. The long run's, as the Windows rows are.
  macos-desktop:
    name: The macOS desktop rows (KB-3, FN-12e)
    needs: [changes, hosts]
    if: github.event_name == 'schedule' || inputs.long == true || inputs.desktops == true || needs.changes.outputs.desktops == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      EXGRID_HOSTS: ${{ github.workspace }}/hosts
      KB3: 'ED-19: after a refused fill|cases 12 and 13|main keys case 5|LV-13: a Ctrl\+Enter fill|on an Apple platform'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dotnet

      - name: The installed browsers the suite resolves by channel
        run: |
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" --version

      - uses: actions/download-artifact@v8
        with:
          name: layer3-hosts
          path: hosts

      - name: The React host, KB-3 and FN-12e
        working-directory: tests/browser
        env:
          EXGRID_HOSTING: react
        run: npx playwright test features.spec.mjs sheet-vs-excel.spec.mjs sizing.spec.mjs part-c.spec.mjs --grep "$KB3|FN-12e" --project=chrome --project=msedge

      - name: The Server host, KB-3's Blazor parts
        working-directory: tests/browser
        env:
          EXGRID_HOSTING: server
        run: npx playwright test features.spec.mjs write-lands.spec.mjs --grep "$KB3" --project=chrome --project=msedge

      - name: Keep the run's records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layer3-records-macos-desktop
          path: |
            verification/
            tests/browser/test-results/
          if-no-files-found: ignore
          retention-days: 30

  # WR-10, the Wrappers' MudBlazor floor (ADR-0205, ADR-0450's note of 2026-11-02): the layer-3 tests that
  # run under a Wrapper, against hosts built with the MudBlazor every Wrapper declares as its floor, and
  # beside them each Wrapper's layer-2 suite at every stable version nuget.org lists within that range.
  # Every other run stays on the version the demo pages pin. Once a person's run before a sign-off, held by
  # its record while its paths were unchanged; now the long run's, which release.yml calls for a release
  # candidate and a version without a suffix, so it gates both at the commit being released, with the
  # versions listed that day. A pull request that changes a Wrapper, or this file, runs it too.
  mudblazor-floor-hosts:
    name: Layer 3's Blazor hosts at the Wrappers' MudBlazor floor
    needs: changes
    if: github.event_name == 'schedule' || inputs.long == true || inputs.desktops == true || needs.changes.outputs.floor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      range: ${{ steps.floor.outputs.range }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dotnet

      # The floor is the range's lower bound, read from the Wrappers themselves, and every Wrapper
      # declares the same range.
      - name: The floor every Wrapper declares
        id: floor
        run: |
          ranges=$(grep -hoE 'Include="MudBlazor" Version="[^"]*"' dotnet/src/*.MudBlazor/*.csproj | sort -u)
          echo "${ranges}"
          test "$(echo "${ranges}" | wc -l)" -eq 1 || { echo "::error::The Wrappers declare different MudBlazor ranges"; exit 1; }
          floor=$(echo "${ranges}" | sed -nE 's/.*Version="\[([0-9]+\.[0-9]+\.[0-9]+),[0-9.]+\)"/\1/p')
          test -n "${floor}" || { echo "::error::The range is not written [floor,ceiling)"; exit 1; }
          echo "floor=${floor}" >> "$GITHUB_OUTPUT"
          echo "range=$(echo "${ranges}" | sed -E 's/.*Version="([^"]*)"/\1/')" >> "$GITHUB_OUTPUT"

      # Every sample the hosts reference that pins MudBlazor is pinned to the floor, or the pin is a
      # downgrade and nothing builds (the record of 2026-10-25: ExChart.Showcases pins its own).
      - name: The demo pages pinned to the floor
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: |
          sed -i -E "s|(Include=\"MudBlazor\" Version=\")[^\"]*\"|\1${FLOOR}\"|" dotnet/samples/*/*.csproj
          git diff --stat

      - name: Publish the WebAssembly DemoHost, the Server host and the demo API server
        working-directory: dotnet
        run: |
          dotnet publish samples/ExGrid.DemoHost -c Release -o ../hosts/wasm
          dotnet publish samples/ExGrid.DemoHost.Server -c Release -o ../hosts/server
          dotnet publish samples/ExGrid.DemoApi -c Release -o ../hosts/api

      # The version each host will load, read back from the files it serves, never assumed.
      - name: Each host loads the floor
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: |
          wasm=$(find hosts/wasm -name 'MudBlazor.*.wasm' | head -1)
          for f in "${wasm}" hosts/server/MudBlazor.dll; do
            test -f "${f}" || { echo "::error::No ${f}"; exit 1; }
            v=$(strings -el "${f}" | grep -A1 '^FileVersion$' | tail -1)
            echo "${f}: ${v}"
            test "${v}" = "${FLOOR}.0" || { echo "::error::${f} is MudBlazor ${v}, not ${FLOOR}"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: mudblazor-floor-hosts
          path: hosts/
          if-no-files-found: error
          retention-days: 7

  mudblazor-floor:
    name: WR-10, layer 3 at the MudBlazor floor against ${{ matrix.hosting }} on ${{ matrix.project }}, shard ${{ matrix.shard }}/${{ matrix.project == 'chrome-150' && 1 || 2 }} (Linux, headed)
    needs: mudblazor-floor-hosts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        hosting: [wasm, server]
        project: [chrome, msedge, chrome-150]
        shard: [1, 2]
        exclude:
          - { project: chrome-150, shard: 2 }
    env:
      # The tests that run under a Wrapper: those whose file, describe or title names MudBlazor or mud
      # (the ?chrome=mud variants among them), and, by name, those that open a page under a Wrapper
      # without saying so. A test of the second kind joins it when it is written.
      WRAPPED: "[Mm]ud|is not the grid's \\(KB-35|apply the condition \\(KB-31, SRV-5\\)|Escape, Escape straight after an Inner Popup|a menu taking the keyboard a round trip late|with and without a Wrapper|SH-46/DC-59: the Selection's outline|the palette reaches the pane|RI-3: every page opens|inspectors\\.spec\\.mjs|WR-7a|DC-58: a bold number that fits"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dotnet

      - name: The installed browsers the suite resolves by channel
        run: |
          google-chrome --version
          microsoft-edge --version

      - uses: actions/download-artifact@v8
        with:
          name: mudblazor-floor-hosts
          path: hosts

      - name: The tests under a Wrapper, headed under xvfb
        working-directory: tests/browser
        env:
          EXGRID_HOSTS: ${{ github.workspace }}/hosts
          EXGRID_HOSTING: ${{ matrix.hosting }}
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 2560x1600x24"
          npx playwright test --grep "$WRAPPED" --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.project == 'chrome-150' && 1 || 2 }}

      - name: Keep the run's records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layer3-records-mudblazor-floor-${{ matrix.hosting }}-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            verification/
            tests/browser/test-results/
          if-no-files-found: ignore
          retention-days: 30

  # Beside the floor run, each Wrapper's layer-2 suite with MudBlazor pinned in its test project to every
  # stable version nuget.org lists within the declared range on the day of the run, the range the hosts job
  # read from every Wrapper. ExChart.MudBlazor's tests are ExChart.Components'. The pin is the nearest
  # reference, so NuGet takes it over the Wrapper's range, and the version each run loaded is read back.
  # Layer 2 sees markup and a component's state, not focus or timing: it adds to the floor run and replaces
  # nothing.
  mudblazor-range:
    name: WR-10, the Wrappers' layer 2 at every MudBlazor of their range
    needs: mudblazor-floor-hosts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dotnet

      - name: Every listed stable version within the range
        id: versions
        env:
          RANGE: ${{ needs.mudblazor-floor-hosts.outputs.range }}
        run: |
          versions=$(node tools/scripts/mudblazor-range.mjs "${RANGE}")
          echo "${versions}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "versions=$(echo ${versions})" >> "$GITHUB_OUTPUT"

      - name: Each Wrapper's layer 2 at each version
        working-directory: dotnet
        env:
          VERSIONS: ${{ steps.versions.outputs.versions }}
        run: |
          for v in ${VERSIONS}; do
            for t in ExGrid.MudBlazor.Tests ExSheet.MudBlazor.Tests ExPivot.MudBlazor.Tests ExChart.Components; do
              echo "::group::${t}, MudBlazor ${v}"
              sed -i "s|</Project>|  <ItemGroup><PackageReference Include=\"MudBlazor\" Version=\"${v}\" /></ItemGroup>\n</Project>|" tests/${t}/${t}.csproj
              dotnet test tests/${t}
              loaded=$(strings -el tests/${t}/bin/Debug/net10.0/MudBlazor.dll | grep -A1 '^FileVersion$' | tail -1)
              git checkout -- tests/${t}/${t}.csproj
              test "${loaded}" = "${v}.0" || { echo "::error::${t} loaded MudBlazor ${loaded}, not ${v}"; exit 1; }
              echo "${t} at MudBlazor ${v}: passed, ${loaded} loaded" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
            done
          done

  # The spec files a push to a pull request changes, each run three times over on each host and
  # browser (tests/browser/README.md, "Before a new or changed spec goes in"). A test that
  # fails one time in a few fails here, on the branch that wrote it, rather than later on a
  # branch that did not touch it. Only the files themselves: a change to a helper they import is
  # the full run's to cover. retries stays 0 (ADR-0026), so a repeat that fails is a failure, and
  # counted-run.sh fails the job unless every test the files list ran three times (ADR-0220).
  browser-repeat:
    name: Changed specs, three times, against ${{ matrix.hosting }} on ${{ matrix.project }} (Linux, headed)
    needs: hosts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Three times over is three full runs of each file, on one runner: a pull request that changes
    # a third of the suite takes about two hours.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        hosting: [wasm, server, react]
        project: [chrome, msedge]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The spec files the pull request adds or changes against its base (its merge commit is
      # HEAD here) that this push changed. A merge of the base brings the base's changes, which
      # are not the pull request's and drop out. The push that opens the pull request, and one
      # whose earlier head is not in the history, take all of the pull request's. Only what the
      # push changed, so the job ends inside the full run's time: it first took every spec file
      # the pull request changes, on every push, and on #42 that was 17 files and 1158 tests,
      # longer than the full run (run 36952902974).
      - name: The spec files this push changes
        id: changed
        env:
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: |
          in_pr=$(git diff --name-only --diff-filter=AMR "origin/${BASE}...HEAD" -- 'tests/browser/*.spec.mjs')
          if [ -n "${BEFORE}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            in_push=$(git diff --name-only "${BEFORE}" "${AFTER}" -- 'tests/browser/*.spec.mjs')
            changed=$(comm -12 <(printf '%s\n' "${in_pr}" | sort -u) <(printf '%s\n' "${in_push}" | sort -u))
          else
            changed=${in_pr}
          fi
          # A file the pull request changes only in comments runs as it did on the base, so it is not
          # repeated: every line the pull request adds or removes in it is blank or a comment. On
          # #137 the spec lint's allowances touched 46 files, and repeating them all took the jobs
          # past their hour.
          code=""
          for file in ${changed}; do
            if git diff -U0 "origin/${BASE}...HEAD" -- "${file}" | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' \
              | grep -qvE '^[-+][[:space:]]*(//.*|/?\*.*)?$'; then
              code="${code} ${file}"
            else
              echo "Not repeated, changed only in comments: ${file}"
            fi
          done
          changed=${code}
          specs=$(printf '%s\n' ${changed} | sed '/^$/d; s#^tests/browser/##' | tr '\n' ' ')
          echo "specs=${specs}" >> "$GITHUB_OUTPUT"
          echo "Repeated: ${specs:-none}"
          # A push that changes no spec file in code, a helper alone among them, repeats nothing, and the
          # job's few seconds are that, said where the check is read rather than only in its log.
          if [ -z "${specs}" ]; then
            echo "Nothing repeated: this push changes no spec file of the pull request's in code." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/dotnet
        if: steps.changed.outputs.specs != ''

      # As in the full run: the published hosts, the demo API server among them (ADR-0069).
      - uses: actions/download-artifact@v8
        if: steps.changed.outputs.specs != ''
        with:
          name: layer3-hosts
          path: hosts

      - name: The changed specs, three times, headed under xvfb
        if: steps.changed.outputs.specs != ''
        working-directory: tests/browser
        env:
          EXGRID_HOSTS: ${{ github.workspace }}/hosts
          EXGRID_HOSTING: ${{ matrix.hosting }}
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 2560x1600x24"
          ./counted-run.sh 3 ${{ steps.changed.outputs.specs }} --project=${{ matrix.project }}

      - name: Keep the run's records
        if: always() && steps.changed.outputs.specs != ''
        uses: actions/upload-artifact@v7
        with:
          name: layer3-repeat-${{ matrix.hosting }}-${{ matrix.project }}
          path: |
            verification/
            tests/browser/test-results/
          if-no-files-found: ignore
          retention-days: 30

  package:
    name: Packages, taken as a Consumer takes them
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # A release's packages are the ones this job packs: built only with the SDK it installs.
      - uses: ./.github/actions/dotnet
        with:
          fallback: ${{ !inputs.version }}

      # Packs the family's sixteen, reads back what each .nuspec declares, and publishes a net10.0
      # application that restores them from the packed files alone.
      - name: Pack, read back, and consume
        working-directory: dotnet
        run: tests/ExGrid.PackageSmoke/check.sh "${{ inputs.version || format('0.0.0-ci.{0}', github.run_number) }}"

      # What the release publishes: these files, not a rebuild. The feed is a dot directory,
      # so MSBuild's default globs leave it alone, and upload-artifact skips hidden paths
      # unless told otherwise.
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dotnet/tests/ExGrid.PackageSmoke/.feed/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  badges:
    name: Publish the coverage badges
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      # The badges branch holds only the badges, the latest table and one line of history
      # per push to main. It is not a code branch and nothing merges it. Each badge is a
      # shields.io endpoint file — the label names the product, which a generated SVG cannot —
      # read by the README; the two SVGs stay for the links that still point at them.
      - name: Update the badges branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          colour() {
            awk -v v="$1" 'BEGIN {
              if (v >= 90) print "brightgreen"; else if (v >= 80) print "green";
              else if (v >= 70) print "yellowgreen"; else if (v >= 60) print "yellow";
              else if (v >= 50) print "orange"; else print "red" }'
          }
          figure() { grep -oP "$1 coverage: \K[0-9.]+" "$2"; }
          # One badge: the label and the line coverage, coloured by it. Branch coverage is in the
          # table the badges link to; on a badge it doubled the width and read as noise.
          endpoint() {
            printf '{"schemaVersion":1,"label":"%s","message":"%s%%","color":"%s"}\n' "$1" "$2" "$(colour "$2")"
          }
          line=$(figure Line coverage/Summary.txt)
          branch=$(figure Branch coverage/Summary.txt)
          git clone --quiet --depth 1 --branch badges "https://x-access-token:${TOKEN}@github.com/${REPO}.git" out \
            || { git init --quiet out && git -C out checkout --quiet --orphan badges; }
          cp "coverage/badge_shieldsio_linecoverage_$(colour "$line").svg" out/coverage-line.svg
          cp "coverage/badge_shieldsio_branchcoverage_$(colour "$branch").svg" out/coverage-branch.svg
          endpoint coverage "$line" > out/coverage-total.json
          history="${line},${branch}"
          for name in ExGrid ExSheet ExPivot ExChart ExBoard Data; do
            summary="coverage/products/$name/Summary.txt"
            p_line=$(figure Line "$summary")
            p_branch=$(figure Branch "$summary")
            endpoint "$name" "$p_line" > "out/coverage-$(echo "$name" | tr '[:upper:]' '[:lower:]').json"
            history="${history},${p_line},${p_branch}"
          done
          cat coverage/products/Summary.md coverage/SummaryGithub.md > out/coverage.md
          # The history gained a column pair per product when the ten packages were first counted;
          # rows before that have the total alone.
          columns='date,commit,line,branch,exgrid_line,exgrid_branch,exsheet_line,exsheet_branch,expivot_line,expivot_branch,exchart_line,exchart_branch,exboard_line,exboard_branch,data_line,data_branch'
          if [ ! -f out/history.csv ]; then
            echo "$columns" > out/history.csv
          elif [ "$(head -n 1 out/history.csv)" != "$columns" ]; then
            sed -i "1s/.*/$columns/" out/history.csv
          fi
          echo "$(date -u +%Y-%m-%dT%H:%MZ),${SHA::7},${history}" >> out/history.csv
          cd out
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Coverage ${line}% lines, ${branch}% branches at ${SHA::7}"
          git push --quiet "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:badges
