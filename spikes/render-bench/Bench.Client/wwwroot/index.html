<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cell-grid render bench</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Bench.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script>
        window.bench = {
            env: () => ({
                userAgent: navigator.userAgent,
                cores: navigator.hardwareConcurrency ?? 0,
                devicePixelRatio: window.devicePixelRatio,
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                memoryGb: (navigator.deviceMemory ?? 0)
            }),

            scrollTop: (el) => (el ? el.scrollTop : 0),

            _fps: null,
            startFps: function () {
                const s = { deltas: [], last: performance.now(), running: true };
                this._fps = s;
                const tick = (t) => {
                    if (!s.running) return;
                    s.deltas.push(t - s.last);
                    s.last = t;
                    requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            },
            stopFps: function () {
                const s = this._fps;
                if (!s) return [];
                s.running = false;
                // drop the first delta: it spans from startFps() to the first frame
                return s.deltas.slice(1);
            }
        };
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
